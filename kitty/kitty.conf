include gruber-darker.conf
linux_display_server wayland
text_composition_strategy legacy
font_size 15.0
adjust_line_height  110% 
cursor #cccccc
cursor_text_color #111111
cursor_shape block
# cursor_beam_thickness 1.5
cursor_blink true
cursor_blink_interval 0.45
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
remember_window_size  no
window_padding_width 0
confirm_os_window_close 0
# background #000000
# background_opacity 0.97
# background_blur 10
shell_integration no-cursor
font_family      family='Iosevka Nerd Font' style=Medium
# font_family      family='JetBrainsMono Nerd Font' style=Medium
bold_font        auto
italic_font      family='Iosevka Nerd Font' style=Italic
# italic_font      family='JetBrainsMono Nerd Font' style=Italic
bold_italic_font auto
sync_to_monitor no
repaint_delay 8
input_delay 2
disable_ligatures always
hide_window_decorations no
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard
