set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"
set -g mode-keys vi

set-option -g automatic-rename off
set-option -g renumber-windows on
set-option -g focus-events on

unbind C-b
set -g prefix M-e
bind M-e send-prefix

bind-key -n M-\; command-prompt
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-Tab last-window

bind r command-prompt "rename-window '%%'"
bind R command-prompt "rename-session '%%'"
bind d detach-client
bind x kill-pane
bind q kill-window
bind s choose-tree
bind v split-window -h
bind b split-window -v
bind n new-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy -in -selection clipboard"

set -g status-style '#{?client_prefix,bg=yellow fg=black,bg=green fg=black}'
